name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # create the release on tags
      id-token: write        # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test
        shell: cmd
        run: |
          cl /nologo /utf-8 /DUNICODE /D_UNICODE /D_CRT_SECURE_NO_WARNINGS /W3 test_imap.c
          test_imap.exe
      - name: Build
        shell: cmd
        run: |
          rc /nologo /fo pigeon.res pigeon.rc
          cl /nologo /MT /O1 /W3 /sdl /guard:cf /D_CRT_SECURE_NO_WARNINGS /DUNICODE /D_UNICODE pigeon.c pigeon.res /link /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /DYNAMICBASE /HIGHENTROPYVA /NXCOMPAT /CETCOMPAT /guard:cf /OUT:pigeon.exe
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash pigeon.exe -Algorithm SHA256).Hash.ToLower() + "  pigeon.exe" | Out-File -Encoding ascii pigeon.exe.sha256
      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          KEY: ${{ secrets.PIGEON_SIGNING_KEY }}   # base64 BCRYPT_ECCPRIVATE_BLOB; the updater only installs what this key signed
        run: |
          $k = [Security.Cryptography.CngKey]::Import([Convert]::FromBase64String($env:KEY), [Security.Cryptography.CngKeyBlobFormat]::EccPrivateBlob)
          $e = [Security.Cryptography.ECDsaCng]::new($k)
          [IO.File]::WriteAllBytes("$PWD\pigeon.exe.sig", $e.SignData([IO.File]::ReadAllBytes("$PWD\pigeon.exe"), [Security.Cryptography.HashAlgorithmName]::SHA256))
      - uses: actions/upload-artifact@v4
        with:
          name: pigeon
          path: |
            pigeon.exe
            pigeon.exe.sha256
      - name: Attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: pigeon.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME pigeon.exe pigeon.exe.sha256 pigeon.exe.sig --generate-notes
